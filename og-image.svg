<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="ogTitle ogDesc">
  <title id="ogTitle">Cumbia and Coding</title>
  <desc id="ogDesc">Open Graph image: dev and design resources with cumbia and Tejano flavor.</desc>
  <!-- Palette matches index.html :root -->
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#234c91" opacity="0.35"/>
      <circle cx="10" cy="10" r="0.6" fill="#234c91" opacity="0.22"/>
    </pattern>
    <linearGradient id="sun" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffc95b" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#f98f21" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#234c91" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#234c91"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Sun burst -->
  <g transform="translate(600 120)">
    <circle r="420" fill="url(#sun)"/>
    <g fill="#ffc95b" opacity="0.35">
      <polygon points="0,-380 14,-120 -14,-120"/>
      <polygon points="0,-380 14,-120 -14,-120" transform="rotate(30)"/>
      <polygon points="0,-380 14,-120 -14,-120" transform="rotate(60)"/>
      <polygon points="0,-380 14,-120 -14,-120" transform="rotate(90)"/>
      <polygon points="0,-380 14,-120 -14,-120" transform="rotate(120)"/>
      <polygon points="0,-380 14,-120 -14,-120" transform="rotate(150)"/>
    </g>
  </g>

  <!-- papel picado inspired banner -->
  <g fill="#25bcc0" stroke="#151515" stroke-width="2" stroke-opacity="0.15">
    <path d="M0 0 L48 0 L60 52 L72 0 L120 0 L132 52 L144 0 L192 0 L204 52 L216 0 L264 0 L276 52 L288 0 L336 0 L348 52 L360 0 L408 0 L420 52 L432 0 L480 0 L492 52 L504 0 L552 0 L564 52 L576 0 L624 0 L636 52 L648 0 L696 0 L708 52 L720 0 L768 0 L780 52 L792 0 L840 0 L852 52 L864 0 L912 0 L924 52 L936 0 L984 0 L996 52 L1008 0 L1056 0 L1068 52 L1080 0 L1128 0 L1140 52 L1152 0 L1200 0 L1200 88 L0 88 Z"/>
  </g>
  <rect y="88" width="1200" height="12" fill="#d71919" opacity="0.92"/>
  <rect y="100" width="1200" height="12" fill="#ffc95b" opacity="0.95"/>
  <rect y="112" width="1200" height="12" fill="#f98f21" opacity="0.9"/>

  <!-- serape stripe -->
  <g transform="translate(0 540)">
    <rect width="240" height="90" fill="#25bcc0"/>
    <rect x="240" width="240" height="90" fill="#ffc95b"/>
    <rect x="480" width="240" height="90" fill="#d71919"/>
    <rect x="720" width="240" height="90" fill="#f98f21"/>
    <rect x="960" width="240" height="90" fill="#234c91"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#151515" stroke-opacity="0.12" stroke-width="2"/>
  </g>

  <!-- Vinyl -->
  <g transform="translate(160 360)">
    <circle r="118" fill="#151515" opacity="0.25"/>
    <circle r="108" fill="#25bcc0" stroke="#ffc95b" stroke-width="4"/>
    <circle r="88" fill="none" stroke="#151515" stroke-opacity="0.2" stroke-width="2"/>
    <circle r="68" fill="none" stroke="#151515" stroke-opacity="0.15" stroke-width="2"/>
    <circle r="48" fill="none" stroke="#151515" stroke-opacity="0.12" stroke-width="2"/>
    <circle r="22" fill="#d71919"/>
    <circle r="8" fill="#ffc95b"/>
  </g>

  <g fill="#ffc95b" opacity="0.9">
    <path transform="translate(1020 200) scale(1.2)" d="M0,-18 L5,-5 L18,-5 L8,4 L12,18 L0,10 L-12,18 L-8,4 L-18,-5 L-5,-5 Z"/>
    <path transform="translate(1080 280) scale(0.85)" d="M0,-18 L5,-5 L18,-5 L8,4 L12,18 L0,10 L-12,18 L-8,4 L-18,-5 L-5,-5 Z"/>
    <path transform="translate(980 320) scale(0.65)" d="M0,-18 L5,-5 L18,-5 L8,4 L12,18 L0,10 L-12,18 L-8,4 L-18,-5 L-5,-5 Z"/>
  </g>

  <text
    x="600"
    y="310"
    text-anchor="middle"
    font-family="system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="86"
    font-weight="800"
    letter-spacing="0.04em"
    fill="#ffc95b"
    stroke="#151515"
    stroke-width="5"
    paint-order="stroke fill"
  >CUMBIA &amp; CODING</text>

  <text
    x="600"
    y="378"
    text-anchor="middle"
    font-family="ui-monospace, Menlo, Monaco, Consolas, monospace"
    font-size="26"
    font-weight="600"
    fill="#25bcc0"
    letter-spacing="0.12em"
  >DEV &#183; DISE&#241;O &#183; M&#250;SICA</text>
  <text
    x="600"
    y="418"
    text-anchor="middle"
    font-family="system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="22"
    fill="#ffc95b"
    opacity="0.95"
  >Recursos, herramientas, y buen gusto &#8212; sin prisa.</text>

  <g transform="translate(600 480)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path stroke="#ffc95b" stroke-width="10" d="M-220 0 L-260 36 L-220 72"/>
    <path stroke="#25bcc0" stroke-width="10" d="M220 0 L260 36 L220 72"/>
  </g>
</svg>
