<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Cumbia and Coding">
  <title>Cumbia and Coding</title>
  <!-- Squircle: grape matches theme-color -->
  <rect width="32" height="32" rx="9" fill="#234c91"/>
  <!-- Code brackets: marigold + teal -->
  <path
    fill="none"
    stroke="#ffc95b"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M 11 7 L 6 16 L 11 25"
  />
  <path
    fill="none"
    stroke="#25bcc0"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="M 21 7 L 26 16 L 21 25"
  />
  <!-- Beat accent (orange dot) -->
  <circle cx="16" cy="16" r="2.2" fill="#f98f21"/>
</svg>
